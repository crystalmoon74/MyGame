<style>
  :root {

  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 10%, #5b1a7a 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, #0f3a6b 0%, transparent 50%),
                linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  .app { width: 100%; max-width: 720px; }
  h1 {
    font-family: "Black Han Sans", sans-serif; font-weight: 400; text-align: center;
    font-size: clamp(36px, 8vw, 60px); margin: 8px 0 4px; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--pink), var(--yellow), var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,79,163,.45));
  }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    padding: 24px; backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .hidden { display: none !important; }
  .label { font-weight: 700; margin: 18px 0 10px; color: var(--muted); font-size: 14px; letter-spacing: .5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--text);
    padding: 10px 16px; border-radius: 999px; cursor: pointer; font: inherit; font-weight: 700;
    transition: .15s;
  }
  .chip:hover { background: rgba(255,255,255,.12); }
  .chip.on { background: linear-gradient(90deg, var(--pink), #b14fff); border-color: transparent; box-shadow: 0 4px 18px rgba(255,79,163,.4); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 16px; padding: 14px 22px; font: inherit; font-weight: 900;
    cursor: pointer; color: #1a0b2e; background: var(--yellow); transition: transform .1s, filter .15s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.97); }
  .btn.big { width: 100%; font-size: 20px; padding: 18px; margin-top: 24px;
    background: linear-gradient(90deg, var(--yellow), #ff9f43); }
  .btn.ghost { background: rgba(255,255,255,.1); color: var(--text); border: 1px solid var(--line); }
  .btn:disabled { opacity: .45; cursor: default; }

  /* HUD */
  .hud { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .pill { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
  .pill b { color: var(--yellow); }

  /* Record player */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 8px 0 4px; }
  .vinyl {
    width: 190px; height: 190px; border-radius: 50%; position: relative;
    background: repeating-radial-gradient(circle, #111 0 2px, #1c1c1c 2px 4px);
    box-shadow: 0 0 0 6px rgba(255,255,255,.05), 0 18px 40px rgba(0,0,0,.6);
  }
  .vinyl::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(130deg, rgba(255,255,255,.18), transparent 40%, transparent 60%, rgba(255,255,255,.08));
  }
  .vinyl .center {
    position: absolute; inset: 62px; border-radius: 50%;
    background: conic-gradient(var(--pink), var(--yellow), var(--cyan), var(--pink));
    display: grid; place-items: center; font-family: "Black Han Sans"; font-size: 15px; color: #1a0b2e;
  }
  .vinyl .center::after { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #1a0b2e; }
  .vinyl.spin { animation: spin 2.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .vinyl .center span { position: absolute; top: 10px; }

  .eq { display: flex; gap: 4px; height: 36px; align-items: flex-end; }
  .eq i { width: 6px; border-radius: 3px; background: linear-gradient(var(--cyan), var(--pink)); height: 6px; transition: height .2s; }
  .eq.on i { animation: eq .9s ease-in-out infinite alternate; }
  .eq.on i:nth-child(2n) { animation-duration: .6s; }
  .eq.on i:nth-child(3n) { animation-duration: 1.1s; }
  .eq.on i:nth-child(5n) { animation-duration: .75s; }
  @keyframes eq { from { height: 6px; } to { height: 36px; } }

  .timer { width: 100%; height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .timer > div { height: 100%; width: 100%; background: linear-gradient(90deg, var(--good), var(--yellow), var(--bad)); transform-origin: left; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .hint { min-height: 28px; text-align: center; color: var(--yellow); font-weight: 700; font-size: 18px; letter-spacing: 2px; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  @media (max-width: 540px) { .choices { grid-template-columns: 1fr; } }
  .choice {
    text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text);
    border-radius: 16px; padding: 14px 16px; cursor: pointer; font: inherit; transition: .15s;
  }
  .choice:hover:not(:disabled) { background: rgba(255,255,255,.14); transform: translateY(-2px); }
  .choice .t { font-weight: 900; font-size: 17px; display: block; }
  .choice .a { color: var(--muted); font-size: 14px; }
  .choice.correct { background: rgba(46,229,157,.25); border-color: var(--good); }
  .choice.wrong { background: rgba(255,84,112,.25); border-color: var(--bad); animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .typing { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 16px; }
  @media (max-width: 540px) { .typing { grid-template-columns: 1fr; } }
  .typing input {
    background: rgba(0,0,0,.25); border: 1px solid var(--line); color: var(--text); border-radius: 14px;
    padding: 14px; font: inherit; outline: none; min-width: 0;
  }
  .typing input:focus { border-color: var(--cyan); }

  .reveal { margin-top: 16px; display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 18px; background: rgba(0,0,0,.25); border: 1px solid var(--line); }
  .reveal img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; background: #222; }
  .reveal .v { font-weight: 900; font-size: 22px; }
  .reveal .v.good { color: var(--good); } .reveal .v.bad { color: var(--bad); }
  .reveal .song { font-weight: 700; } .reveal .meta { color: var(--muted); font-size: 14px; }
  .reveal .grow { flex: 1; min-width: 0; }

  .loading { text-align: center; padding: 40px 0; }
  .loading .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin: 16px auto; max-width: 360px; }
  .loading .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--cyan)); transition: width .2s; }

  .result { text-align: center; }
  .result .score { font-family: "Black Han Sans"; font-size: 72px; color: var(--yellow); margin: 8px 0; }
  .result .rank { font-size: 22px; font-weight: 900; }
  .history { text-align: left; margin-top: 20px; display: grid; gap: 6px; max-height: 320px; overflow: auto; }
  .history div { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: 14px; display: flex; gap: 8px; }
  .best { color: var(--muted); font-size: 14px; text-align: center; margin-top: 14px; }
  .toast { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); padding: 12px 20px; border-radius: 14px; background: #000c; font-weight: 700; z-index: 9; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; opacity: .7; }
</style>
</head>
<body>
<div class="app">
  <h1>가요 타임머신</h1>
  <p class="sub">1990 ~ 2020 히트곡, 전주만 듣고 맞춰보세요!</p>

  <!-- 시작 화면 -->
  <section id="setup" class="card">
    <div class="label">🎚️ 시대 선택 (여러 개 가능)</div>
    <div class="chips" id="eras">
      <button class="chip on" data-era="90">90년대</button>
      <button class="chip on" data-era="00">2000년대</button>
      <button class="chip on" data-era="10">2010년대</button>
    </div>
    <div class="label">🎮 게임 모드</div>
    <div class="chips" id="modes">
      <button class="chip on" data-mode="choice">객관식 (4지선다)</button>
      <button class="chip" data-mode="type">주관식 (가수 + 제목 입력)</button>
    </div>
    <div class="label">🔢 문제 수</div>
    <div class="chips" id="counts">
      <button class="chip" data-count="5">5곡</button>
      <button class="chip on" data-count="10">10곡</button>
      <button class="chip" data-count="15">15곡</button>
    </div>
    <button class="btn big" id="startBtn">▶ 게임 시작</button>
    <div class="best" id="bestScore"></div>
  </section>

  <!-- 로딩 -->
  <section id="loading" class="card loading hidden">
    <div style="font-size:40px">💿</div>
    <div id="loadingText">노래를 찾는 중...</div>
    <div class="bar"><div id="loadingBar"></div></div>
  </section>

  <!-- 게임 -->
  <section id="game" class="card hidden">
    <div class="hud">
      <div class="pill">문제 <b id="qNum">1</b> / <span id="qTotal">10</span></div>
      <div class="pill" id="eraPill">🗓️ ????년</div>
      <div class="pill">점수 <b id="score">0</b></div>
    </div>
    <div class="stage">
      <div class="vinyl" id="vinyl"><div class="center"><span>K-POP</span></div></div>
      <div class="eq" id="eq"></div>
      <div class="timer"><div id="timerBar"></div></div>
      <div class="controls">
        <button class="btn ghost" id="playBtn">⏸ 일시정지</button>
        <button class="btn ghost" id="replayBtn">↺ 처음부터</button>
        <button class="btn ghost" id="hintBtn">💡 힌트 (-30점)</button>
        <button class="btn ghost" id="skipBtn">⏭ 모르겠어요</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="choices" id="choices"></div>
    <form class="typing hidden" id="typing" autocomplete="off">
      <input id="inArtist" placeholder="가수 (예: 서태지와 아이들)">
      <input id="inTitle" placeholder="제목 (예: 난 알아요)">
      <button class="btn" type="submit">정답!</button>
    </form>

    <div class="reveal hidden" id="reveal">
      <img id="revealArt" alt="">
      <div class="grow">
        <div class="v" id="revealVerdict"></div>
        <div class="song" id="revealSong"></div>
        <div class="meta" id="revealMeta"></div>
      </div>
      <button class="btn" id="nextBtn">다음 ▶</button>
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" class="card result hidden">
    <div style="font-size:48px" id="resultEmoji">🏆</div>
    <div class="rank" id="resultRank"></div>
    <div class="score" id="resultScore">0</div>
    <div class="meta" id="resultDetail" style="color:var(--muted)"></div>
    <div class="history" id="history"></div>
    <button class="btn big" id="againBtn">↺ 다시 하기</button>
  </section>

  <p class="foot">음원: Apple iTunes 30초 미리듣기 · 인터넷 연결이 필요해요</p>
</div>

<audio id="audio" preload="auto"></audio>

const eraOf = y => y < 2000 ? "90" : y < 2010 ? "00" : "10";
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const chosung = s => [...s].map(c => { const k = c.charCodeAt(0) - 0xAC00; return k >= 0 && k < 11172 ? CHO[(k / 588) | 0] : c === " " ? " " : /[a-z0-9]/i.test(c) ? c[0].toUpperCase() : c; }).join("");
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

// 편집거리 기반 유사도 (오타 조금은 봐줌)
function similar(a, b) {
  a = norm(a); b = norm(b); if (!a || !b) return false;
  if (a === b || (a.length >= 2 && b.includes(a) && a.length / b.length > 0.6)) return true;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length] <= Math.floor(Math.max(a.length, b.length) / 5);
}

// ───────── iTunes 미리듣기 검색 (JSONP: 파일로 열어도 동작) ─────────
let jsonpId = 0;
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "__itunes" + (++jsonpId), s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 8000);
    function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error("network")); };
    s.src = url + "&callback=" + cb;
    document.head.appendChild(s);
  });
}
// iTunes는 분당 요청 수 제한이 있어서, 찾은 곡은 브라우저에 저장해 두고 요청 사이에 간격을 둔다.
const CACHE_KEY = "kpopquiz-previews-v1";
const cache = (() => { try { return JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch { return {}; } })();
const saveCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch {} };
const sleep = ms => new Promise(r => setTimeout(r, ms));
let lastRequest = 0;
async function search(url, onWait) {
  for (let attempt = 0; attempt < 4; attempt++) {
    const gap = 700 - (Date.now() - lastRequest);
    if (gap > 0) await sleep(gap);
    lastRequest = Date.now();
    try { return (await jsonp(url)).results || []; }
    catch (e) { onWait && onWait(); await sleep(4000 * (attempt + 1)); }
  }
  throw new Error("rate-limited");
}
async function findPreview(song, onWait) {
  const key = song.artist + "|" + song.title;
  if (key in cache) return cache[key];
  const titleN = norm(song.title), names = [song.artist, song.en, ...song.alias].map(norm);
  const pick = results => results.find(r => r.previewUrl &&
      (norm(r.trackName).includes(titleN) || titleN.includes(norm(r.trackName))) &&
      names.some(n => n && (norm(r.artistName).includes(n) || n.includes(norm(r.artistName)))));
  for (const [term, country] of [[`${song.artist} ${song.title}`, "KR"], [`${song.en} ${song.title}`, "KR"], [`${song.en} ${song.title}`, "US"]]) {
    const url = `https://itunes.apple.com/search?media=music&entity=song&limit=15&country=${country}&term=${encodeURIComponent(term)}`;
    let results;
    try { results = await search(url, onWait); } catch { return null; } // 네트워크 문제는 캐시하지 않음
    const r = pick(results);
    if (r) { cache[key] = { url: r.previewUrl, art: (r.artworkUrl100 || "").replace("100x100", "300x300"), album: r.collectionName }; saveCache(); return cache[key]; }
  }
  cache[key] = null; saveCache();
  return null;
}

// ───────── 화면 전환 ─────────
function show(id) { for (const s of ["setup","loading","game","result"]) $(s).classList.toggle("hidden", s !== id); }

// 옵션 칩
$("eras").onclick = e => { const b = e.target.closest(".chip"); if (!b) return;
  const on = !b.classList.contains("on");
  if (!on && state.eras.size === 1) return toast("최소 한 시대는 골라주세요!");
  b.classList.toggle("on", on); on ? state.eras.add(b.dataset.era) : state.eras.delete(b.dataset.era); };
function single(groupId, key, parse = v => v) {
  $(groupId).onclick = e => { const b = e.target.closest(".chip"); if (!b) return;
    [...$(groupId).children].forEach(c => c.classList.toggle("on", c === b)); state[key] = parse(b.dataset[key]); };
}
single("modes", "mode"); single("counts", "count", Number);
$("eq").innerHTML = "<i></i>".repeat(18);

function bestKey() { return "kpopquiz-best-" + state.mode; }
function readBest() { try { return Number(localStorage.getItem(bestKey())) || 0; } catch { return 0; } }
function showBest() { const b = readBest(); $("bestScore").textContent = b ? `🏅 ${state.mode === "choice" ? "객관식" : "주관식"} 최고 기록: ${b}점` : ""; }
$("modes").addEventListener("click", showBest); showBest();

// ───────── 게임 시작 ─────────
$("startBtn").onclick = startGame;
$("againBtn").onclick = () => { show("setup"); showBest(); };

async function startGame() {
  const pool = shuffle(SONGS.filter(s => state.eras.has(eraOf(s.year))));
  const want = Math.min(state.count, pool.length);
  show("loading"); $("loadingBar").style.width = "0";
  const picked = [];
  // 이미 찾아 둔 곡을 먼저 써서 요청 수를 줄인다
  pool.sort((a, b) => !!cache[b.artist + "|" + b.title] - !!cache[a.artist + "|" + a.title] || Math.random() - .5);
  for (const song of pool) {
    if (picked.length >= want) break;
    $("loadingText").textContent = `노래를 찾는 중... (${picked.length}/${want})`;
    const p = await findPreview(song, () => $("loadingText").textContent = "음원 서버가 바빠요, 잠시 기다리는 중... ⏳");
    if (p) { picked.push({ ...song, ...p }); $("loadingBar").style.width = (picked.length / want * 100) + "%"; }
  }
  if (!picked.length) { show("setup"); return toast("노래를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."); }
  game = { list: picked, i: 0, score: 0, correct: 0, history: [], pool: SONGS.filter(s => state.eras.has(eraOf(s.year))) };
  $("qTotal").textContent = picked.length; $("score").textContent = 0;
  show("game"); nextQuestion();
}

// ───────── 라운드 ─────────
let raf = 0;
function nextQuestion() {
  const q = game.list[game.i];
  game.cur = { q, start: performance.now(), hintLevel: 0, done: false, elapsed: 0 };
  $("qNum").textContent = game.i + 1;
  $("eraPill").textContent = `🗓️ ${eraOf(q.year) === "90" ? "90년대" : eraOf(q.year) === "00" ? "2000년대" : "2010년대"}`;
  $("hint").textContent = ""; $("reveal").classList.add("hidden");
  $("hintBtn").disabled = false; $("skipBtn").disabled = false;

  const isChoice = state.mode === "choice";
  $("choices").classList.toggle("hidden", !isChoice);
  $("typing").classList.toggle("hidden", isChoice);
  if (isChoice) {
    // 같은 시대 곡을 오답으로 우선 사용
    const others = shuffle(game.pool.filter(s => s.title !== q.title || s.artist !== q.artist));
    const sameEra = others.filter(s => eraOf(s.year) === eraOf(q.year));
    const wrong = [...sameEra, ...others].filter((s, i, a) => a.indexOf(s) === i).slice(0, 3);
    $("choices").innerHTML = "";
    shuffle([q, ...wrong]).forEach(s => {
      const b = document.createElement("button"); b.className = "choice";
      b.innerHTML = `<span class="t"></span><span class="a"></span>`;
      b.querySelector(".t").textContent = s.title; b.querySelector(".a").textContent = s.artist;
      b.dataset.ok = s === q ? "1" : "";
      b.onclick = () => answerChoice(b);
      $("choices").appendChild(b);
    });
  } else {
    $("inArtist").value = ""; $("inTitle").value = ""; setTimeout(() => $("inArtist").focus(), 50);
  }

  audio.src = q.url; audio.currentTime = 0;
  audio.play().catch(() => toast("▶ 버튼을 눌러 재생해 주세요"));
  cancelAnimationFrame(raf); tick();
}

function tick() {
  const c = game.cur;
  if (!c.done) {
    const t = audio.currentTime || 0;
    $("timerBar").style.transform = `scaleX(${Math.max(0, 1 - t / ROUND_SECONDS)})`;
    if (audio.ended || t >= ROUND_SECONDS - 0.2) return finish(false, "⏰ 시간 초과!");
  }
  raf = requestAnimationFrame(tick);
}

function setPlaying(on) { $("vinyl").classList.toggle("spin", on); $("eq").classList.toggle("on", on); $("playBtn").textContent = on ? "⏸ 일시정지" : "▶ 재생"; }
audio.onplay = () => setPlaying(true);
audio.onpause = audio.onended = () => setPlaying(false);
$("playBtn").onclick = () => audio.paused ? audio.play() : audio.pause();
$("replayBtn").onclick = () => { audio.currentTime = 0; audio.play(); };
$("skipBtn").onclick = () => finish(false, "😅 패스!");

$("hintBtn").onclick = () => {
  const c = game.cur; if (c.done) return;
  c.hintLevel++;
  const q = c.q;
  const hints = [`📅 ${q.year}년 발표곡`, `🎤 가수: ${chosung(q.artist)}  ·  🎵 제목: ${chosung(q.title)}`];
  $("hint").textContent = hints.slice(0, c.hintLevel).join("   |   ");
  if (c.hintLevel >= hints.length) $("hintBtn").disabled = true;
};

function points() {
  const t = Math.min(audio.currentTime || 0, ROUND_SECONDS);
  const base = state.mode === "type" ? 150 : 100;
  return Math.max(10, Math.round(base * (1 - t / ROUND_SECONDS * 0.7)) - game.cur.hintLevel * 30);
}

function answerChoice(btn) {
  if (game.cur.done) return;
  const ok = !!btn.dataset.ok;
  [...$("choices").children].forEach(b => { b.disabled = true; if (b.dataset.ok) b.classList.add("correct"); });
  if (!ok) btn.classList.add("wrong");
  finish(ok);
}

$("typing").onsubmit = e => {
  e.preventDefault(); if (game.cur.done) return;
  const q = game.cur.q, a = $("inArtist").value, t = $("inTitle").value;
  if (!a.trim() && !t.trim()) return toast("가수나 제목을 입력해 주세요!");
  const artistOk = [q.artist, q.en, ...q.alias].some(x => similar(a, x));
  const titleOk = [q.title, ...q.alias].some(x => similar(t, x));
  if (artistOk && titleOk) return finish(true);
  // 반만 맞추면 부분 점수
  if (artistOk || titleOk) return finish("half", artistOk ? "👍 가수만 맞췄어요!" : "👍 제목만 맞췄어요!");
  finish(false);
};

function finish(result, msg) {
  const c = game.cur; if (c.done) return; c.done = true;
  let gain = 0;
  if (result === true) gain = points();
  else if (result === "half") gain = Math.round(points() / 2);
  game.score += gain; if (result === true) game.correct++;
  $("score").textContent = game.score;
  game.history.push({ q: c.q, result, gain });

  [...$("choices").children].forEach(b => { b.disabled = true; if (b.dataset.ok) b.classList.add("correct"); });
  $("hintBtn").disabled = true; $("skipBtn").disabled = true;
  if (audio.paused && !audio.ended) audio.play().catch(() => {});

  const q = c.q, v = $("revealVerdict");
  v.textContent = msg || (result === true ? `🎉 정답! +${gain}점` : "❌ 아쉬워요!");
  if (result === "half") v.textContent += ` +${gain}점`;
  v.className = "v " + (result ? "good" : "bad");
  $("revealSong").textContent = `${q.artist} - ${q.title}`;
  $("revealMeta").textContent = `${q.year}년${q.album ? " · " + q.album : ""}`;
  $("revealArt").src = q.art || "";
  $("reveal").classList.remove("hidden");
  $("nextBtn").textContent = game.i + 1 < game.list.length ? "다음 ▶" : "결과 보기 🏆";
  $("nextBtn").focus();
}

$("nextBtn").onclick = () => {
  game.i++;
  if (game.i < game.list.length) return nextQuestion();
  audio.pause(); cancelAnimationFrame(raf); showResult();
};

function showResult() {
  const n = game.list.length, pct = game.correct / n;
  const ranks = [[0.9, "🏆", "가요계 레전드! 당신은 걸어다니는 음악방송"], [0.7, "🥇", "노래방 에이스! 대단해요"],
                 [0.4, "🎧", "꽤 들어본 귀! 조금만 더"], [0, "📻", "추억 충전이 필요해요"]];
  const [, emoji, label] = ranks.find(r => pct >= r[0]);
  $("resultEmoji").textContent = emoji; $("resultRank").textContent = label;
  $("resultScore").textContent = game.score + "점";
  let best = readBest(), isNew = game.score > best;
  if (isNew) { try { localStorage.setItem(bestKey(), game.score); } catch {} }
  $("resultDetail").textContent = `${n}문제 중 ${game.correct}개 정답` + (isNew ? " · 🎊 최고 기록 갱신!" : best ? ` · 최고 기록 ${best}점` : "");
  $("history").innerHTML = "";
  game.history.forEach(h => {
    const d = document.createElement("div");
    d.textContent = `${h.result === true ? "⭕" : h.result === "half" ? "🔺" : "❌"}  ${h.q.year} · ${h.q.artist} - ${h.q.title}  (+${h.gain})`;
    $("history").appendChild(d);
  });
  show("result");
}
</script>
</body>
</html>
